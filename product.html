<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GitLab - Add Product</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #f4f6fa;
    }

    .sidebar {
      width: 220px;
      background-color: #2e2e2e;
      color: #fff;
      padding: 20px;
    }

    .sidebar h2 {
      font-size: 20px;
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      color: #ddd;
      text-decoration: none;
      margin-bottom: 15px;
    }


    .main-content {
      flex: 1;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
    }

    form {
      background-color: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 600px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #444;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      background-color: #7b3fe4;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #5f2fc1;
    }
  </style>
</head>
<body>


  <div class="main-content">
    <h1>Add New Product</h1>
    <form>
      <label for="pname">Product Name</label>
      <input type="text" id="pname" name="pname" placeholder="Enter product name" required>

      <label for="price">Price</label>
      <input type="number" id="price" name="price" placeholder="Enter product price" required>

      <label for="desc">Description</label>
      <textarea id="desc" name="desc" rows="4" placeholder="Enter product description"></textarea>

      <label for="category">Category</label>
      <input type="text" id="category" name="category" placeholder="e.g., Electronics, Clothing">

      <button type="submit">Add Product</button>
    </form>
  </div>

</body>
</html>
